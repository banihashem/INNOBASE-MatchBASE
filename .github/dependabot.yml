version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      testing-tools:
        patterns: ["vitest", "@vitest/*", "@testing-library/*"]
    commit-message:
      prefix: "[MB-MAINT]"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[MB-MAINT]"
