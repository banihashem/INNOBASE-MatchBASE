name: matchbase-slice1

services:
  postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    environment:
      POSTGRES_DB: matchbase_slice1
      POSTGRES_USER: matchbase_test
      POSTGRES_PASSWORD: ${MATCHBASE_TEST_DATABASE_PASSWORD:?MATCHBASE_TEST_DATABASE_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchbase_test -d matchbase_slice1"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
    restart: "no"
    security_opt:
      - no-new-privileges:true
