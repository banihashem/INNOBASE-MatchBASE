name: matchbase-local-model

services:
  ollama:
    image: ollama/ollama@sha256:8eb6c4d16138c8320f2598f03e01b3549f6ed2e41fe6ac16329a5a921b314914
    platform: linux/amd64
    profiles: [qualification]
    user: "1000:1000"
    read_only: true
    init: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 4
    mem_limit: 10g
    pids_limit: 256
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_KEEP_ALIVE: 60s
      OLLAMA_LOAD_TIMEOUT: 120s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=268435456,mode=1777
    volumes:
      - model-artifacts:/models:ro
    networks: [inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  inference:
    internal: true

volumes:
  model-artifacts:
    external: true
    name: matchbase-local-model-artifacts-v1
